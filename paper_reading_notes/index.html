<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文阅读笔记</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #fffdf8;
      --line: #d8dfed;
      --text: #1d2430;
      --muted: #5d6677;
      --link: #275df1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f6f4ef 0%, #f1efe8 100%);
      color: var(--text);
    }
    .page {
      width: min(900px, calc(100vw - 24px));
      margin: 32px auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(29, 36, 48, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 40px);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 16px;
    }
    .list {
      margin-top: 20px;
      display: grid;
      gap: 14px;
    }
    .item {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .item:hover {
      transform: translateY(-2px);
      border-color: #bdd0ff;
      box-shadow: 0 14px 28px rgba(39, 93, 241, 0.10);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: var(--link);
      margin-bottom: 8px;
    }
    .meta {
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>论文阅读笔记</h1>
      <p>这里收集按网页形式整理的论文笔记。每篇页面都是独立 HTML，可以直接打开阅读和分享。</p>

      <div class="list">
        <a class="item" href="./tlt_asplos26.html">
          <div class="title">TLT · ASPLOS 2026</div>
          <div class="meta">Taming the Long-Tail: Efficient Reasoning RL Training with Adaptive Drafter</div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
